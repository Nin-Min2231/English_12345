name: lop2_english_app
description: App luyện tiếng Anh lớp 2 (Global Success) - demo slice offline.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

# CR-026: icon app (nhân vật "Nin" cầm sách sao, nguồn `03_Art_cu/icon_app.webp`
# — ảnh gốc nằm ngoài repo, chỉ 2 file đã crop/dựng sẵn trong assets/icon/ mới
# thuộc repo). Sinh icon: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon_flat.png"
  adaptive_icon_background: "#FF8A3D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Sprint 4 — đa lớp: mỗi lớp 1 thư mục con `lopN/` dưới `assets/content/` và
  # `assets/data/` (xem ContentRepository.load/asset). Lớp 1 hiện chỉ khai
  # Unit01 — CHƯA khai Unit02-16 vì chưa có file thật (Flutter báo lỗi build
  # nếu khai 1 thư mục asset rỗng/không tồn tại), thêm dần khi làm tới unit đó.
  assets:
    - assets/icon/
    - assets/sfx/
    - assets/data/lop2/
    - assets/data/lop2/games/
    - assets/data/lop1/
    - assets/data/lop1/games/
